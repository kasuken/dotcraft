Relevant skills in this plugin: `blazor-saas-stack`, `modern-csharp-coding-standards`, `csharp-async`, `dotnet-timezone`, `ef-core`, `efcore-patterns`, `optimizing-ef-core-queries`, `dotnet-webapi`, the Blazor skills (`author-component`, `collect-user-input`, `coordinate-components`, `fetch-and-send-data`, `support-prerendering`, `use-js-interop`, `configure-auth`), `mudblazor`, `mudblazor-design-system`, `csharp-xunit`, `bunit-testing`, `playwright-blazor-testing`, `testcontainers-integration-tests`.

## Code design rules

- Follow the project's conventions first, then common C# conventions. Keep naming, formatting and structure consistent.
- Don't add interfaces or abstractions unless they serve an external dependency or a test seam. Don't wrap existing abstractions.
- Least exposure: `private` > `internal` > `protected` > `public`.
- Don't edit generated code (`*.g.cs`, `// <auto-generated>`, migration designer files).
- Comments explain why, not what. Add XML docs to new public APIs.
- No unused methods or parameters. When fixing one method, check its siblings for the same bug.
- Keep user-facing strings localizable when the project is localized.

## Errors and edge cases

- Guard early: `ArgumentNullException.ThrowIfNull(x)`, `ArgumentException.ThrowIfNullOrWhiteSpace(s)`. Avoid the `!` operator as a shortcut.
- Throw precise exception types. Never throw or catch bare `Exception` except at a top-level boundary that logs.
- No silent catches: log and rethrow, or let it bubble.

## Production-ready by default

- Secure: no secrets in code or config files, validate input, least privilege, authorise every data access by owner.
- Resilient I/O: timeouts, and retry with backoff where it fits (`IHttpClientFactory` + resilience handlers).
- Structured logging with scopes; never log personal data or tokens.
- Diagnostics: health checks, metrics and traces through OpenTelemetry when the app has them.
- Configuration through strongly typed options with validation (`ValidateDataAnnotations().ValidateOnStart()`).

## Modern C#

- Use what the target framework supports: file-scoped namespaces, primary constructors, collection expressions, raw string literals, pattern matching, `required` members, records for DTOs.
- C# 14 (.NET 10): extension members, the `field` keyword, implicit span conversions, null-conditional assignment (`?.=`), `nameof` with unbound generics, partial constructors and events.
- Don't change the TFM, SDK or `<LangVersion>` unless asked.
- If syntax is unfamiliar, compile or check the docs before "fixing" it.

## Async

- Async all the way; no `.Result`, `.Wait()` or `GetAwaiter().GetResult()`.
- Accept and pass a `CancellationToken` end to end; make delays cancellable.
- Timeouts with a linked `CancellationTokenSource` and `CancelAfter`.
- `ConfigureAwait(false)` in library code only; not in Blazor components or ASP.NET Core app code.
- Use `ValueTask` only when measured. Don't add `async`/`await` just to return a task.
- `await using` for async-disposable resources.

## Performance

- Simple first; optimise measured hot paths.
- EF Core: `AsNoTracking` for reads, project with `Select`, avoid N+1, paginate on the server.
- Stream large payloads; use `Span<T>`, `Memory<T>` and pooling only where it matters.

## Blazor

- Keep components thin; business logic lives in services.
- Handle loading, empty and error states.
- Never call `DbContext` from a component; use `IDbContextFactory` inside services when a component's lifetime would otherwise hold a context too long.
- Implement `IAsyncDisposable` to unsubscribe from events and cancel work.
- Use MudBlazor components and the app's `MudTheme`; no hard-coded colours.

## Tests

- Use the framework already in the solution (xUnit, NUnit or MSTest) and its assertion library (AwesomeAssertions or FluentAssertions when present).
- Test project per production project: `Product.Application.Tests`, `Product.Web.Tests`, and so on. Mirror class names: `OrderService` → `OrderServiceTests`.
- Name tests by behaviour (`Archived_tasks_do_not_appear_on_today`). Arrange-Act-Assert, one behaviour per test, no branching in tests.
- Parameterised tests for several inputs with the same outcome (`[Theory]` + `[InlineData]`).
- Test through public APIs; avoid `InternalsVisibleTo` unless the repo already uses it.
- Prefer real collaborators or simple fakes to mocks. Never mock code that is part of the solution under test.
- Data rules need integration tests against a real database, not EF's in-memory provider.
- Work on one failing test until it passes, then run the rest.

## Finish

After implementing, run `dotnet-validate`. Then get a review from the **code-reviewer** agent: start it yourself if your tool lets one agent start another; otherwise tell the user to run code-reviewer on the diff. Fix what it reports, or explain why a finding doesn't apply.
